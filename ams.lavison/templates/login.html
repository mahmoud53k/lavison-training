<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMS Lavison | Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/ams-logo.jpg') }}" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="brand-block">
        <img class="login-logo" src="{{ url_for('static', filename='img/ams-logo.jpg') }}" alt="Lavison logo" />
      </div>

      <form method="post" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
            autofocus
          />
        </div>
        <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" /></div>
        <button type="submit" class="btn btn-primary full">Sign in</button>
      </form>
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %}
      <div class="flash-list">
        {% for category, message in messages %}
        <div
          class="flash {% if category == 'error' %}error{% elif category == 'warning' %}warning{% else %}success{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %}
    </div>
  </body>
</html>
